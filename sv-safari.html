<p class="mut">게임 코드가 아니에요. 주소를 열면 저절로 시작해요. 처음 2~3분은 노란 창이 뜨면 시키는 대로 한 번씩 해 주세요(누르기, 조이스틱, 기기 돌리기, 홈에 다녀오기). 그 뒤 20분쯤은 화면을 켜 둔 채 두시면 돼요. 끝나면 [결과 복사]를 눌러 채팅에 붙여 넣어 주세요. 이 기기의 시험판 저장은 끝나면 그대로 되돌려요.</p>

, \"s2school:bell\", \"s2school:locker\", \"s2school:v5\", \"s2school:board\", \"s2hall:duri\", \"s2hall:seats\", \"s2hall:score\", \"s2rest:miru\", \"s2rest:box\", \"s2rest:pavilion\", \"demo_drag\", \"s2rest:bushC\", \"s2plaza:duri\", \"s2plaza:pedestal\"], \"started\": true, \"dust\": [\"plaza:0\", \"market:0\", \"library:0\", \"map:v2\", \"map:v3\"], \"s2dust\": [\"s2school:0\", \"s2school:h:locker\", \"s2hall:0\", \"s2rest:0\", \"s2rest:cushion\", \"s2plaza:c0\", \"s2plaza:c1\"], \"s2bloom\": [\"s2school\", \"s2hall\", \"s2rest\"], \"accSeen\": [\"block\", \"lamp\", \"rest\"], \"lumi\": {\"owned\": [], \"sky\": [], \"wear\": \"\"}, \"wordSeen\": [\"걸쇠\", \"경첩\"], \"story\": {\"clues\": [1], \"emb2\": 1, \"win\": {\"2\": 0}}}";

 const sk=document.createElement('button');sk.className='no';sk.textContent='건너뛰기';sk.onclick=()=>end('skip');A.appendChild(sk);
 A.style.display='block';const t0=Date.now();const iv=setInterval(()=>{if(stopped)return end('skip');const left=Math.ceil((timeout-(Date.now()-t0))/1000);t.textContent=left+'초 안에 안 하면 건너뛰어요';if(left<=0)end('timeout');try{if(check&&check())end('ok');}catch(_){}},300);});}

$('go').onclick=()=>run();$('stop').onclick=()=>{stopped=true;};
$('copy').onclick=async()=>{const t='[사파리 자동 검증 결과]\n'+R.map(r=>r[0]+' '+r[1]).join('\n');try{await navigator.clipboard.writeText(t);say('복사했어요. 채팅에 붙여 넣어 주세요.');}catch(_){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();say('복사했어요. 채팅에 붙여 넣어 주세요.');}};
// 주소를 열면 저절로 시작(지난번에 사파리가 죽었으면 저절로 시작하지 않고 결과를 먼저 보여 줌)
if(crashed)say('지난 검증이 중간에 끊겼어요(위 결과). [처음부터 다시]를 누르면 다시 해요.');else setTimeout(run,1500);
</script></body></html>
